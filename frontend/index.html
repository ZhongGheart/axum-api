<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axum Admin</title>

    <!-- 预连接到 API 服务器（减少 DNS 查询和连接时间） -->
    <link rel="preconnect" href="/api" />
    <link rel="dns-prefetch" href="/api" />

    <!-- 预加载骨架屏关键 CSS（内联，避免首次渲染阻塞） -->
    <style>
      /* 首屏骨架屏 - 在 JS 加载完成前显示 */
      #app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f5f7fa;
      }
      .app-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e8e8e8;
        border-top-color: #2080f0;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 首屏骨架屏：Vue 挂载前显示，挂载后自动替换 -->
    <div id="app">
      <div id="app-loading">
        <div class="app-loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
