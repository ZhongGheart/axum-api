name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt / clippy / unit / integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axum_api_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/axum_api_it
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_JWT_SECRET: integration-test-secret-value-0123456789
      # S3 mock（v0.27.0）：对象存储后端的集成测试打的是 moto，
      # 它是 S3 协议的 wire-level 实现，opendal 会真的签名并解析状态码。
      # 不用 minio 容器是因为 CI 里再拉一层容器慢且脆；
      # 不用 minio 二进制是因为官方下载地址已全部 410。
      TEST_S3_ENDPOINT: http://127.0.0.1:59000
      TEST_S3_BUCKET: axum-test
      TEST_S3_ACCESS_KEY_ID: testkey
      TEST_S3_SECRET_ACCESS_KEY: testsecret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # 警告即失败：历史上积累了 35 条 clippy 警告，正是死代码长期未被发现的信号
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --locked --all-targets --all-features

      # 集成测试需要真实 Postgres + Redis，故标记为 #[ignore] 并在此显式运行
      - name: Install moto (S3 mock)
        run: |
          # 必须装进独立 venv，不能直接 `pip install moto[server]`。
          #
          # GitHub runner 镜像自带 apt 版 boto3/botocore
          # （/usr/lib/python3/dist-packages），而裸 pip 装的 moto 落在
          # ~/.local。pip 认为 "boto3 已满足" 而不再装一份，于是形成错配：
          # 新 moto → 系统老 botocore → urllib3.contrib.pyopenssl
          # → 系统老 pyOpenSSL，ABI 不匹配直接报
          # `AttributeError: module 'lib' has no attribute 'GEN_EMAIL'`。
          # moto_server 起不来，后续建 bucket 的 curl 连接被拒（退出码 7）。
          #
          # 难查的地方在于 pip 全程绿灯：错配发生在解释器的 import 期，
          # 不在安装器里，所以安装日志里看不到任何异常。
          # venv 里系统包彻底不可见，依赖由 pip 自己解析成一致的一套。
          # （本地实测：venv 中 pyOpenSSL 压根没装，那条崩溃路径就不存在。）
          python3 -m venv /tmp/moto-venv
          /tmp/moto-venv/bin/pip install --quiet --upgrade pip
          /tmp/moto-venv/bin/pip install --quiet "moto[server]~=5.2"

          /tmp/moto-venv/bin/moto_server -p 59000 -H 127.0.0.1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:59000/ > /dev/null && break
            sleep 0.5
          done

          # 就绪必须**断言**。原来的写法里 `for` 循环即使一次都没成功，
          # 循环体结束后的退出码仍是 0，于是流程继续往下走，
          # 直到建 bucket 的 curl 才以"退出码 7"失败——
          # 报出来的是一个连接错误，真正的原因（moto 压根没起来）被埋掉了。
          if ! curl -sf http://127.0.0.1:59000/ > /dev/null; then
            echo "::error::moto_server 未能在 20 秒内就绪，服务日志如下："
            jobs -l || true
            exit 1
          fi

          # 建 bucket：程序不建 bucket（那是部署方的责任），
          # 但集成测试自己得准备好，否则第一个上传用例就会失败
          curl -sf -X PUT http://127.0.0.1:59000/axum-test

      - name: Integration tests
        run: cargo test --locked --test api_integration -- --ignored --test-threads=1

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker images and compose config
    runs-on: ubuntu-latest
    needs: [rust, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t axum-api:ci .

      - name: Build frontend image
        run: docker build -t axum-web:ci ./frontend

      # 校验编排文件可解析（缺少必填变量时应当直接失败）
      - name: Validate compose file
        env:
          DB_PASSWORD: ci-db-password
          JWT_SECRET: ci-compose-secret-value-0123456789abcdef
        run: docker compose config > /dev/null
