name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt / clippy / unit / integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axum_api_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/axum_api_it
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_JWT_SECRET: integration-test-secret-value-0123456789
      # S3 mock（v0.27.0）：对象存储后端的集成测试打的是 moto，
      # 它是 S3 协议的 wire-level 实现，opendal 会真的签名并解析状态码。
      # 不用 minio 容器是因为 CI 里再拉一层容器慢且脆；
      # 不用 minio 二进制是因为官方下载地址已全部 410。
      TEST_S3_ENDPOINT: http://127.0.0.1:59000
      TEST_S3_BUCKET: axum-test
      TEST_S3_ACCESS_KEY_ID: testkey
      TEST_S3_SECRET_ACCESS_KEY: testsecret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # 警告即失败：历史上积累了 35 条 clippy 警告，正是死代码长期未被发现的信号
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --locked --all-targets --all-features

      # 集成测试需要真实 Postgres + Redis，故标记为 #[ignore] 并在此显式运行
      - name: Install moto (S3 mock)
        run: |
          pip install --quiet "moto[server]"
          moto_server -p 59000 -H 127.0.0.1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:59000/ && break
            sleep 0.5
          done
          # 建 bucket：程序不建 bucket（那是部署方的责任），
          # 但集成测试自己得准备好，否则第一个上传用例就会失败
          curl -sf -X PUT http://127.0.0.1:59000/axum-test

      - name: Integration tests
        run: cargo test --locked --test api_integration -- --ignored --test-threads=1

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker images and compose config
    runs-on: ubuntu-latest
    needs: [rust, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t axum-api:ci .

      - name: Build frontend image
        run: docker build -t axum-web:ci ./frontend

      # 校验编排文件可解析（缺少必填变量时应当直接失败）
      - name: Validate compose file
        env:
          DB_PASSWORD: ci-db-password
          JWT_SECRET: ci-compose-secret-value-0123456789abcdef
        run: docker compose config > /dev/null
