[package]
name = "axum-api"
version = "0.1.0"
edition = "2021"
description = "Production-grade Rust backend API with Axum, SQLx, JWT auth"
authors = ["dev"]
license = "MIT"

[dependencies]
# Web框架
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }

# 数据库
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 配置管理
dotenvy = "0.15"

# Redis 异步客户端
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }

# 密码加密
argon2 = "0.5"

# SHA-256（仅用于兼容 v0.1 旧口令格式，v0.3 起可移除）
sha2 = "0.10"

# JWT
jsonwebtoken = "9"

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Excel 导出
rust_xlsxwriter = "0.82"

# 文件下载（响应头）
axum-extra = { version = "0.10", features = ["typed-header"] }

# 系统监控（CPU/内存/磁盘/进程）
sysinfo = "0.33"


